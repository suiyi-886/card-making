<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心意贺卡 · 个性化贺卡生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FFF6F2; --panel:#FFFFFF; --ink:#5A463B; --soft:#8A7264;
    --accent:#FF9EB5; --accent2:#FFD9A0; --line:#FFE3D6;
    --font:"PingFang SC","Microsoft YaHei",sans-serif;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:linear-gradient(180deg,#FFF9F6 0%,#FDEFE8 100%);
    color:var(--ink);
    min-height:100vh;
    padding:26px 18px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header.top{text-align:center;margin-bottom:22px;}
  header.top h1{
    font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;
    font-size:34px;margin:0 0 6px;color:var(--ink);
  }
  header.top p{margin:0;color:var(--soft);font-size:14px;}

  .layout{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:22px;align-items:start;}
  @media(max-width:880px){ .layout{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:0 12px 30px rgba(120,90,60,.08);
  }
  .panel h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .panel h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--soft);margin-bottom:6px;font-weight:600;}
  .field input[type=text],.field input[type=number],.field textarea, .field select{
    width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font-size:14px;font-family:inherit;color:var(--ink);background:#FFFDFB;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field textarea{resize:vertical;min-height:54px;line-height:1.5;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,158,181,.15);}
  .hint{font-size:11.5px;color:#B49C8E;margin-top:4px;}

  .seg{display:flex;flex-wrap:wrap;gap:8px;}
  .seg button{
    flex:1 1 auto;min-width:64px;border:1px solid var(--line);background:#FFFDFB;
    border-radius:12px;padding:9px 6px;font-size:13.5px;cursor:pointer;color:var(--soft);
    font-family:inherit;transition:all .15s;
  }
  .seg button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;box-shadow:0 6px 14px rgba(255,158,181,.3);}
  .seg.theme button.active{background:var(--ink);border-color:var(--ink);}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chips button{
    border:1px solid var(--line);background:#FFFDFB;border-radius:999px;padding:8px 13px;
    font-size:13px;cursor:pointer;color:var(--soft);font-family:inherit;transition:all .15s;
    display:flex;align-items:center;gap:6px;
  }
  .chips button .sw{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .chips button.active{border-color:var(--accent);color:var(--ink);font-weight:600;box-shadow:0 0 0 3px rgba(255,158,181,.15);}

  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  button.act{
    border:1px solid var(--line);background:#FFFDFB;border-radius:12px;padding:11px 14px;
    font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit;transition:all .15s;flex:1 1 auto;
  }
  button.act:hover{border-color:var(--accent);}
  button.act.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;flex:1 1 100%;box-shadow:0 8px 18px rgba(255,158,181,.32);}
  button.act.primary:hover{filter:brightness(1.03);}

  /* ---------- 贺卡本体 ---------- */
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .card-shell{width:100%;display:flex;justify-content:center;}
  .card{
    width:100%;max-width:460px;aspect-ratio:4/5;border-radius:22px;position:relative;overflow:hidden;
    background:var(--bg);color:var(--ink);padding:34px 30px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    box-shadow:0 24px 60px rgba(80,50,30,.18);
    font-family:var(--font);
    transition:background .25s,color .25s;
  }
  .card .deco{position:absolute;font-size:26px;opacity:.9;user-select:none;pointer-events:none;}
  .card .eyebrow{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:700;z-index:1;}
  .card .title{font-family:"ZCOOL KuaiLe","Ma Shan Zheng",serif;font-size:30px;margin:6px 0 2px;color:var(--ink);z-index:1;letter-spacing:.02em;}
  .card .name{font-family:"ZCOOL KuaiLe",var(--font);font-weight:700;font-size:34px;margin:10px 0 4px;color:var(--ink);z-index:1;word-break:break-word;line-height:1.15;}
  .card .sub{font-size:13.5px;color:var(--soft);z-index:1;letter-spacing:.05em;}
  .card .divider{width:54px;height:2px;background:var(--accent);border-radius:2px;margin:14px 0;z-index:1;opacity:.8;}
  .card .body{font-size:15px;line-height:1.85;color:var(--ink);z-index:1;white-space:pre-line;text-align:left;width:100%;padding:0 4px;}
  .card .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;z-index:1;}
  .card .tag{font-size:12.5px;padding:5px 12px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);background:rgba(255,255,255,.35);}
  .card .sig{margin-top:14px;font-size:12px;letter-spacing:.28em;color:var(--soft);text-transform:uppercase;z-index:1;}

  /* 纪念日：回忆拍立得 */
  .card .polaroid{
    margin:4px auto 2px;background:#fff;padding:8px 8px 22px;border-radius:6px;max-width:80%;
    box-shadow:0 10px 22px rgba(0,0,0,.16);transform:rotate(-2deg);z-index:1;cursor:pointer;
    transition:transform .3s;
  }
  .card .polaroid:hover{transform:rotate(0deg) scale(1.02);}
  .card .polaroid .ph{font-size:13px;color:#444;line-height:1.6;font-family:var(--font);}
  .card .polaroid .cap{font-size:11px;color:#9a8;margin-top:6px;font-family:"Ma Shan Zheng",serif;}

  /* 激励：能量语交互 */
  .card .energy{
    margin-top:14px;z-index:1;border:1px dashed var(--accent);border-radius:14px;
    padding:10px 14px;cursor:pointer;background:rgba(255,255,255,.4);min-width:70%;
    transition:transform .15s;
  }
  .card .energy:hover{transform:translateY(-2px);}
  .card .energy .lab{font-size:11px;color:var(--soft);letter-spacing:.1em;}
  .card .energy .word{font-family:"ZCOOL KuaiLe",var(--font);font-size:20px;color:var(--accent);margin-top:2px;}

  /* 小动画 */
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .card.bday .deco.cake{animation:bob 2.4s ease-in-out infinite;}
  @keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  .card.pop-in{animation:pop .4s ease;}

  .counter{font-size:12px;color:var(--soft);text-align:center;}
  .counter b{color:var(--accent);}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;}

  @media print{
    body{background:#fff;padding:0;}
    .wrap > header, .panel, .actions, .counter, #confetti{display:none !important;}
    .layout{display:block;}
    .card{box-shadow:none;aspect-ratio:auto;max-width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🎴 心意贺卡生成器</h1>
    <p>填一点点关于 TA 的信息，生成一张独一无二、可直接分享或打印的贺卡</p>
  </header>

  <div class="layout">
    <!-- 输入面板 -->
    <section class="panel" id="inputs">
      <h2><span class="dot"></span>填写信息</h2>

      <div class="field">
        <label for="name">姓名 / 称呼</label>
        <input type="text" id="name" placeholder="例如：蒋瑶、老妈、阿杰" />
      </div>

      <div class="field">
        <label for="relation">你们的关系</label>
        <select id="relation">
          <option value="朋友">朋友</option>
          <option value="闺蜜">闺蜜</option>
          <option value="兄弟">兄弟</option>
          <option value="家人">家人</option>
          <option value="恋人">恋人</option>
          <option value="同事">同事</option>
          <option value="同学">同学</option>
          <option value="老师">老师</option>
          <option value="自己">写给自己</option>
        </select>
      </div>

      <div class="field" id="numField">
        <label id="numLabel" for="num">年龄（选填）</label>
        <input type="number" id="num" placeholder="例如：21" min="1" max="200" />
      </div>

      <div class="field type-only" data-for="anniversary" style="display:none">
        <label for="annName">纪念日名称</label>
        <input type="text" id="annName" placeholder="例如：恋爱纪念日 / 在一起百日" />
      </div>
      <div class="field type-only" data-for="anniversary" style="display:none">
        <label for="annDate">纪念日日期</label>
        <input type="text" id="annDate" placeholder="例如：2023.05.20" />
        <div class="hint">这一天会标注在贺卡上</div>
      </div>
      <div class="field type-only" data-for="cheer" style="display:none">
        <label for="goal">个人目标 / 想做成的事</label>
        <input type="text" id="goal" placeholder="例如：瘦十斤 / 考上研究生 / 跑完半马" />
        <div class="hint">会据此生成针对性的鼓励语</div>
      </div>

      <div class="field">
        <label for="hobbies">兴趣爱好</label>
        <textarea id="hobbies" placeholder="用逗号或顿号分隔，例如：摄影, 健身, 英雄联盟"></textarea>
        <div class="hint">多个爱好用「,」「、」隔开，会写进祝福语且每句都不同</div>
      </div>

      <div class="field">
        <label for="traits">性格特征（选填）</label>
        <textarea id="traits" placeholder="例如：较真, 慢热, 很靠谱"></textarea>
        <div class="hint">填 TA 的性格关键词，祝福语会更贴人</div>
      </div>

      <div class="field">
        <label for="memories">共同回忆（选填）</label>
        <textarea id="memories" placeholder="每行写一件，例如：&#10;大二那年在操场上聊到天亮&#10;上次一起赶项目熬的夜"></textarea>
        <div class="hint">每行一件，纪念日/激励卡会做成回忆卡展示</div>
      </div>

      <div class="field">
        <label for="tendency">祝福倾向</label>
        <select id="tendency">
          <option value="warm">温暖</option>
          <option value="humor">幽默</option>
          <option value="inspire">励志</option>
          <option value="heartfelt">走心</option>
          <option value="restrained">克制</option>
        </select>
      </div>

      <h2 style="margin-top:18px"><span class="dot"></span>贺卡类型</h2>
      <div class="seg" id="typeSeg">
        <button data-v="birthday" class="active">🎂 生日</button>
        <button data-v="cheer">✨ 激励</button>
        <button data-v="anniversary">💞 纪念日</button>
      </div>

      <h2 style="margin-top:18px"><span class="dot"></span>视觉风格</h2>
      <div class="chips" id="themeChips"></div>

      <h2 style="margin-top:18px"><span class="dot"></span>字数长度</h2>
      <div class="seg" id="lenSeg">
        <button data-v="short">短 · 利落</button>
        <button data-v="medium" class="active">中 · 适中</button>
        <button data-v="long">长 · 绵长</button>
      </div>

      <div class="actions" style="margin-top:18px">
        <button class="act primary" id="genBtn">🎉 生成贺卡</button>
        <button class="act" id="shuffleBtn">🔁 换一句（不重复）</button>
        <button class="act" id="imgBtn">🖼 下载图片</button>
        <button class="act" id="printBtn">🖨 打印 / 存PDF</button>
        <button class="act" id="linkBtn">🔗 复制分享链接</button>
      </div>
    </section>

    <!-- 预览 -->
    <section class="stage">
      <div class="card-shell">
        <div class="card bday pop-in" id="card" data-theme="cream"></div>
      </div>
      <div class="counter">已为你生成 <b id="genCount">0</b> 张不重复的贺卡</div>
    </section>
  </div>
</div>
<canvas id="confetti"></canvas>

function normHobby(h){
  h = h.trim();
  if(HOBBY_ALIAS[h]) return HOBBY_ALIAS[h];
  var keys = Object.keys(HOBBY_ALIAS);
  for(var i=0;i<keys.length;i++){ if(h.indexOf(keys[i])>=0) return HOBBY_ALIAS[keys[i]]; }
  return h;
}
function tailsFor(h){
  var n = normHobby(h);
  if(HOBBY_TAILS[n]) return HOBBY_TAILS[n];
  return GENERIC_TAILS.map(function(t){return t.replace(/\{h\}/g,n);});
}
function humorTailsFor(h){
  var n = normHobby(h);
  if(HUMOR_TAILS[n]) return HUMOR_TAILS[n];
  return GENERIC_HUMOR.map(function(t){return t.replace(/\{h\}/g,n);});
}

/* ===================== 工具 ===================== */
function $(id){ return document.getElementById(id); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickDistinct(n,arr){
  var pool = arr.slice(), out = [];
  while(out.length<n && pool.length){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
  return out;
}
function parseList(raw){
  if(!raw) return [];
  return raw.split(/[,，、;；\s]+/).map(function(s){return s.trim();}).filter(Boolean);
}
function parseMemories(raw){
  if(!raw) return [];
  return raw.split(/[\n;；]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>1;});
}

/* ===================== 生成文案 ===================== */
function buildCard(o){
  var who = o.name && o.name.trim() ? o.name.trim() : "亲爱的你";
  var open = pick(REL_OPEN[o.relation] || REL_OPEN["朋友"]);
  var relNoun = o.relation === "自己" ? "自己" : (o.relation || "朋友");
  var hobbies = parseList(o.hobbies).slice(0,3);
  var traits = parseList(o.traits).slice(0,2);
  var memories = parseMemories(o.memories);
  var len = o.length || "medium";
  var isHumor = o.tendency === "humor";

  var eyebrow, title, sub, decoKind;
  if(o.type === "birthday"){
    eyebrow = "生日快乐"; title = "HAPPY BIRTHDAY"; decoKind="bday";
    sub = o.num ? ("第 "+o.num+" 个生日 · "+o.num+" YEARS") : "又一年，值得纪念";
  } else if(o.type === "anniversary"){
    eyebrow = "纪念日快乐"; title = "HAPPY ANNIVERSARY"; decoKind="anni";
    var an = (o.annName && o.annName.trim()) ? o.annName.trim() : "";
    var ad = (o.annDate && o.annDate.trim()) ? o.annDate.trim() : "";
    if(an && ad) sub = an + " · " + ad;
    else if(an) sub = an;
    else if(ad) sub = "这一天 · " + ad;
    else sub = "属于你们的日子";
  } else {
    eyebrow = "给你打气"; title = "KEEP GOING"; decoKind="cheer";
    sub = o.num ? ("已经坚持 "+o.num+" 天，了不起") : "撑了很久了吧，辛苦了";
  }

  var parts = [];
  parts.push(open + "，" + (o.type==="anniversary" ? (relNoun==="自己"?"今天是属于你的日子。":"今天是属于你们的日子。") : (o.type==="cheer"?"想跟你说几句真心话。":"生日快乐呀。")));

  if(hobbies.length){
    var openF = isHumor ? "" : pick(FLOURISH);
    var leadT = isHumor ? pick(["听好，","说真的，","别眨眼，"]) : (o.type==="birthday" ? pick(["新的一岁，","啰嗦两句，","其实想叮嘱你的挺多，","说点真心话，",""]) : pick(["啰嗦两句，","其实想叮嘱你的挺多，","说点真心话，",""]));
    if(openF) leadT = "";
    var tailFn = isHumor ? humorTailsFor : tailsFor;
    var used = {}, tails = [];
    hobbies.forEach(function(h){
      var t = tailFn(h);
      var idx;
      do { idx = Math.floor(Math.random()*t.length); } while(t.length>1 && used[h+"#"+idx]);
      used[h+"#"+idx] = true;
      tails.push(t[idx]);
    });
    var joiner = isHumor ? pick(["，顺便愿","，也盼","，祝你"]) : pick(["，也愿","，盼着","，愿你","，祝"]);
    var middle = (openF || leadT ? (openF || leadT) : "") + "愿" + tails.join(joiner) + "。";
    parts.push(middle);
  }

  if(traits.length && len !== "short"){
    var tr = pick(traits);
    parts.push(pick([
      "你那种"+tr+"的样子，一直挺打动我的。",
      "说真的，"+tr+"的你，是我很喜欢的版本。",
      "你总是"+tr+"，这点我特别佩服。",
      "记得你"+tr+"的时候，眼里是有光的。"
    ]));
  }

  if(memories.length && (len!=="short" || o.type!=="birthday")){
    var mem = pick(memories);
    parts.push(pick([
      "一直记得"+mem+"，那会儿真好。",
      "想起"+mem+"，还是会笑出来。",
      "还记得"+mem+"吗？现在想起来还是很暖。"
    ]));
  }

  if(o.type==="cheer" && o.goal && o.goal.trim()){
    var g = o.goal.trim();
    parts.push(pick([
      "你定的目标——"+g+"，我替你记着呢。",
      "关于"+g+"，别急，按自己的节奏来就好。",
      g+"这件事，配得上你这份坚持。",
      "朝着"+g+"走的人，本身就在发光。"
    ]));
  }

  var endN = len==="short" ? 1 : 2;
  var endPool = TEND_ENDINGS[o.tendency] || TEND_ENDINGS.warm;
  if(o.type!=="birthday"){ endPool = endPool.filter(function(e){ return !/新的一岁|慢慢长大|年龄只是个数字/.test(e); }); }
  if(endPool.length<1) endPool = TEND_ENDINGS.warm;
  var endings = pickDistinct(endN, endPool);
  endings.forEach(function(e){ parts.push(e); });

  if(len === "long"){
    var refl = ["愿望很小，平安就好。","往后的路，我都在。","你只管往前，好运在后头。","慢慢长大，也慢慢被温柔以待。"];
    if(o.type!=="birthday") refl = refl.filter(function(e){ return e.indexOf("慢慢长大")<0; });
    parts.push(pick(refl));
  }

  var full = parts.join("\n");
  return {
    eyebrow:eyebrow, title:title, sub:sub, decoKind:decoKind,
    body:full, name:who,
    tags: hobbies.map(normHobby),
    memory: (memories.length && (o.type!=="birthday"||len!=="short")) ? memories[0] : ""
  };
}

/* ===================== 历史去重 ===================== */
var HISTORY_KEY = "cardGenHistory_v1";
function loadHistory(){
  try{ var a = JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]"); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function saveHistory(a){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(a.slice(-500))); }catch(e){} }
function normText(t){ return (t||"").replace(/\s+/g,"").replace(/[，。、！？\.]/g,""); }
function isDuplicate(text){ return loadHistory().some(function(h){ return normText(h)===normText(text); }); }
function generateUnique(o){
  for(var i=0;i<40;i++){
    var c = buildCard(o);
    if(!isDuplicate(c.body)){ var h=loadHistory(); h.push(c.body); saveHistory(h); return c; }
  }
  var last = buildCard(o); last.body = last.body + " #" + (Date.now()%1000); return last;
}
function countUnique(){ return loadHistory().length; }

var CUR = null;
function applyTheme(key){
  var t = THEMES[key] || THEMES.cream;
  var card = $("card");
  card.style.setProperty("--bg", t.bg);
  card.style.setProperty("--ink", t.ink);
  card.style.setProperty("--soft", t.soft);
  card.style.setProperty("--accent", t.accent);
  card.style.setProperty("--accent2", t.accent2);
  card.style.setProperty("--line", t.accent);
  card.style.background = t.bg; card.style.color = t.ink; card.style.fontFamily = t.font;
  card.dataset.theme = key;
}
function escapeHtml(s){
  return (s==null?"":String(s)).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});
}
function renderCard(c, themeKey){
  var t = THEMES[themeKey] || THEMES.cream;
  var card = $("card");
  card.className = "card pop-in " + (c.decoKind==="bday"?"bday":c.decoKind==="cheer"?"cheer":"anni");
  card.style.background = t.bg; card.style.color = t.ink;

  var dpos = [["top:14px;left:16px;"],["top:14px;right:16px;"],["bottom:16px;left:18px;"],["bottom:16px;right:18px;"],["top:50%;left:10px;"]];
  var decoHtml = "";
  t.deco.slice(0,4).forEach(function(e,i){ decoHtml += '<span class="deco" style="'+dpos[i]+'">'+e+'</span>'; });

  var inner = decoHtml;
  inner += '<div class="eyebrow">'+c.eyebrow+'</div>';
  inner += '<div class="title">'+c.title+'</div>';
  inner += '<div class="name">'+escapeHtml(c.name)+'</div>';
  inner += '<div class="sub">'+escapeHtml(c.sub)+'</div>';
  inner += '<div class="divider"></div>';

  if(c.decoKind==="anni" && c.memory){
    inner += '<div class="polaroid" onclick="flipMemory(this)"><div class="ph">'+escapeHtml(c.memory)+'</div><div class="cap">我们的回忆 · 点击翻面</div></div>';
  }
  if(c.decoKind==="cheer"){
    inner += '<div class="energy" onclick="cycleEnergy(this)"><div class="lab">✨ 点我抽一句能量语</div><div class="word">'+ENERGY_WORDS[0]+'</div></div>';
    inner += '<div class="divider"></div>';
  }

  inner += '<div class="body">'+escapeHtml(c.body)+'</div>';

  if(c.tags.length){
    inner += '<div class="tags">'+c.tags.map(function(tg){return '<span class="tag">'+escapeHtml(tg)+'</span>';}).join("")+'</div>';
  }
  inner += '<div class="sig">With Love</div>';
  card.innerHTML = inner;
}

var STATE = { type:"birthday", theme:"cream", length:"medium" };
function readInputs(){
  return {
    name:$("name").value, relation:$("relation").value,
    num: $("num").value.trim() ? parseInt($("num").value,10) : null,
    hobbies:$("hobbies").value, traits:$("traits").value, memories:$("memories").value,

    annName:$("annName").value, annDate:$("annDate").value, goal:$("goal").value
  };
}
function doGenerate(){ CUR = generateUnique(readInputs()); renderCard(CUR, STATE.theme); $("genCount").textContent = countUnique(); burst(); }
function doShuffle(){ if(!CUR){ doGenerate(); return; } CUR = generateUnique(readInputs()); renderCard(CUR, STATE.theme); $("genCount").textContent = countUnique(); }

/* ===================== 分享链接 ===================== */
function encodeState(){
  var d = {n:$("name").value,t:$("relation").value,nu:$("num").value,h:$("hobbies").value,tr:$("traits").value,m:$("memories").value,te:$("tendency").value,ty:STATE.type,th:STATE.theme,le:STATE.length,an:$("annName").value,ad:$("annDate").value,go:$("goal").value};
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }catch(e){ return ""; }
}
function applyStateFromHash(){
  if(location.hash.length<2) return false;
  try{
    var d = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    if(d.n!=null) $("name").value=d.n;
    if(d.t!=null) $("relation").value=d.t;
    if(d.nu!=null) $("num").value=d.nu;
    if(d.h!=null) $("hobbies").value=d.h;
    if(d.tr!=null) $("traits").value=d.tr;
    if(d.m!=null) $("memories").value=d.m;
    if(d.te!=null) $("tendency").value=d.te;
    if(d.an!=null) $("annName").value=d.an;
    if(d.ad!=null) $("annDate").value=d.ad;
    if(d.go!=null) $("goal").value=d.go;
    if(d.ty!=null){ STATE.type=d.ty; setSeg("typeSeg",d.ty); updateNumLabel(); updateTypeFields(); }
    if(d.th!=null){ STATE.theme=d.th; setTheme(d.th); }
    if(d.le!=null){ STATE.length=d.le; setSeg("lenSeg",d.le); }
    return true;
  }catch(e){ return false; }
}

  setTimeout(function(){ el.style.transform=""; }, 150);
}

var confettiRAF = null, confettiParts = [], confettiN = 0, confettiCtx = null, confettiCv = null;
function burst(){
  var cv = $("confetti"); if(!cv) return;
  if(confettiRAF){ cancelAnimationFrame(confettiRAF); confettiRAF = null; } // 先取消上一次，避免动画堆积
  confettiCv = cv; confettiCtx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  var emo = ["🎉","✨","🎈","💛","🎂","🌟","💖"];
  confettiParts = [];
  for(var i=0;i<70;i++){
    confettiParts.push({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.3, s:18+Math.random()*16,
      vy:2+Math.random()*3, vx:(Math.random()-0.5)*2, a:Math.random()*Math.PI*2, va:(Math.random()-0.5)*0.2,
      e:emo[Math.floor(Math.random()*emo.length)]});
  }
  confettiN = 0;
  function tick(){
    if(!confettiCtx) return;
    confettiCtx.clearRect(0,0,confettiCv.width,confettiCv.height);
    confettiParts.forEach(function(p){
      p.y+=p.vy; p.x+=p.vx; p.a+=p.va;
      confettiCtx.save(); confettiCtx.translate(p.x,p.y); confettiCtx.rotate(p.a); confettiCtx.font=p.s+"px serif"; confettiCtx.fillText(p.e,0,0); confettiCtx.restore();
    });
    confettiN++;
    if(confettiN<120){ confettiRAF = requestAnimationFrame(tick); }
    else { confettiCtx.clearRect(0,0,confettiCv.width,confettiCv.height); confettiRAF = null; confettiParts = []; }
  }
  confettiRAF = requestAnimationFrame(tick);
}

/* ===================== 下载图片（Canvas，主题同步） ===================== */
function downloadImage(){
  if(!CUR) doGenerate();
  var t = THEMES[STATE.theme] || THEMES.cream;
  var W=800,H=1000, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  var ctx=cv.getContext("2d");
  ctx.fillStyle=t.bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=t.accent; ctx.lineWidth=2; ctx.globalAlpha=.5;
  roundRect(ctx,30,30,W-60,H-60,18); ctx.stroke(); ctx.globalAlpha=1;
  ctx.textAlign="center";
  ctx.fillStyle=t.accent; ctx.font='700 16px sans-serif';
  if("letterSpacing" in ctx) ctx.letterSpacing="8px";
  ctx.fillText(CUR.eyebrow.toUpperCase(), W/2, 110);
  if("letterSpacing" in ctx) ctx.letterSpacing="0px";
  ctx.fillStyle=t.ink; ctx.font='700 40px "ZCOOL KuaiLe", sans-serif';
  ctx.fillText(CUR.title, W/2, 175);
  ctx.font='700 52px "ZCOOL KuaiLe", sans-serif';
  ctx.fillText(CUR.name, W/2, 250);
  ctx.fillStyle=t.soft; ctx.font='400 18px sans-serif';
  ctx.fillText(CUR.sub, W/2, 300);
  ctx.strokeStyle=t.accent; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(W/2-30,338); ctx.lineTo(W/2+30,338); ctx.stroke();
  ctx.fillStyle=t.ink; ctx.font='400 21px sans-serif';
  var lines = wrapText(ctx, CUR.body, 620);
  var lh=38, sy=392;
  lines.forEach(function(ln,i){ ctx.fillText(ln, W/2, sy+i*lh); });
  if(CUR.tags.length){
    ctx.font='400 16px sans-serif'; ctx.fillStyle=t.accent; ctx.strokeStyle=t.accent;
    var widths=CUR.tags.map(function(x){return ctx.measureText(x).width+32;});
    var tot=widths.reduce(function(a,b){return a+b;},0)+12*(CUR.tags.length-1);
    var sx=(W-tot)/2, ty=H-130, th=34;
    CUR.tags.forEach(function(x,i){
      roundRect(ctx,sx,ty,widths[i],th,th/2); ctx.stroke();
      ctx.fillText(x,sx+widths[i]/2,ty+22); sx+=widths[i]+12;
    });
  }
  ctx.fillStyle=t.soft; ctx.font='400 13px sans-serif';
  if("letterSpacing" in ctx) ctx.letterSpacing="6px";
  ctx.fillText("WITH LOVE", W/2, H-70);
  if("letterSpacing" in ctx) ctx.letterSpacing="0px";
  var url=cv.toDataURL("image/png");
  var a=document.createElement("a"); a.href=url; a.download="贺卡-"+(CUR.name||"心意")+".png"; a.click();
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapText(ctx,text,maxW){
  var out=[]; text.split("\n").forEach(function(para){
    if(!para){ out.push(""); return; }
    var line="";
    for(var i=0;i<para.length;i++){
      var ch=para[i], test=line+ch;
      if(ctx.measureText(test).width>maxW && line){ out.push(line); line=ch; }
      else line=test;
    }
    if(line) out.push(line);
  });
  return out;
}

/* ===================== 事件 ===================== */
function init(){
  var chips = $("themeChips");
  THEME_ORDER.forEach(function(k){
    var b=document.createElement("button"); b.dataset.v=k;
    b.innerHTML='<span class="sw" style="background:'+THEMES[k].accent+'"></span>'+THEMES[k].name;
    if(k===STATE.theme) b.classList.add("active");
    b.addEventListener("click",function(){ setTheme(k); });
    chips.appendChild(b);
  });
  $("typeSeg").querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){ STATE.type=b.dataset.v; setSeg("typeSeg",STATE.type); updateNumLabel(); updateTypeFields(); });
  });
  $("lenSeg").querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){ STATE.length=b.dataset.v; setSeg("lenSeg",STATE.length); });
  });
  $("genBtn").addEventListener("click",doGenerate);
  $("shuffleBtn").addEventListener("click",doShuffle);
  $("imgBtn").addEventListener("click",downloadImage);
  $("printBtn").addEventListener("click",function(){ window.print(); });
  $("linkBtn").addEventListener("click",function(){
    var code=encodeState(); location.hash=code;
    var url=location.href;
    if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ alert("分享链接已复制，发给朋友打开即可还原这张卡：\n\n"+url); },function(){ prompt("复制下面的链接：",url); }); }
    else prompt("复制下面的链接：",url);
  });
  if(applyStateFromHash()){ /* 还原后由用户点生成 */ }
  updateNumLabel(); updateTypeFields();
  CUR = buildCard({name:"",relation:"朋友",num:null,hobbies:"",traits:"",memories:"",tendency:"warm",type:"birthday",length:"medium"});
  renderCard(CUR, STATE.theme);
  $("genCount").textContent = countUnique();
}
window.addEventListener("DOMContentLoaded", init);
</script>
